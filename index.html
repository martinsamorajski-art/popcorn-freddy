<!doctype html>
<html lang="de" data-palette="wald" data-anim="on">
<head>
  <meta charset="utf-8" />
  <script>
    // MUST be inline and first: sets <base href="/"> so root-relative assets
    // resolve at the site root when this page is served under a locale prefix
    // (/at/, /de/, …). Without it, relative <script>/<link> URLs resolve under
    // the prefix and get swallowed by the /{locale}/* catch-all. No fetch, so
    // it wins before pf-locale.js (which is itself a relative script).
    if (/^\/(?:at-en|de-en|ch-en|at|de|ch|us)(?:\/|$)/i.test(location.pathname) || /\/produkt\//i.test(location.pathname)) {
      var b = document.createElement('base'); b.href = '/'; document.head.appendChild(b);
    }
  </script>
  <!-- Locale routing (URL prefixes). On the bare domain it detects the country
       via /api/geo and redirects to a locale prefix. Load in <head>. -->
  <script src="pf-locale.js?v=20260808j"></script>
  <script>window.PFLocale && PFLocale.bootstrap();</script>

  <link rel="stylesheet" href="rd-styles.css?v=20260808j">
  <!-- Above-the-fold faces: fetched in parallel with the stylesheet instead of
       after it, so the loader does not have to wait for CSS to discover them. -->

  <link rel="preload" as="font" type="font/ttf" href="assets/fonts/alegreya-sans-400.ttf" crossorigin>
  <link rel="preload" as="font" type="font/ttf" href="assets/fonts/alegreya-sans-700.ttf" crossorigin>
  <link rel="preload" as="image" href="assets/hero-family-crop.webp" fetchpriority="high" media="(max-width: 1024px)">
  <link rel="preload" as="image" href="assets/hero-family.webp" fetchpriority="high" media="(min-width: 1025px)">

  <script>
    (function () {
      var loader = document.getElementById('rd-loader');
      if (!loader) return;
      var shown = Date.now();
      var minVisible = 500;
      function hide() {
        var wait = Math.max(0, minVisible - (Date.now() - shown));
        setTimeout(function () {
          loader.classList.add('rd-loader-hide');
          setTimeout(function () { loader.remove(); }, 700);
        }, wait);
      }
      var root = document.getElementById('root');
      // Wait for BOTH: React has painted AND the webfonts are in. Hiding on
      // paint alone is what made the first frame show the fallback font and
      // then visibly swap. Fonts get a 2.5s cap of their own so a slow
      // connection can never hold the loader hostage.
      function whenFontsReady(cb) {
        if (!document.fonts || !document.fonts.ready) { cb(); return; }
        var done = false, fire = function () { if (!done) { done = true; cb(); } };
        document.fonts.ready.then(fire);
        setTimeout(fire, 2500);
      }
      var mo = new MutationObserver(function () {
        if (root.childElementCount > 0) { mo.disconnect(); whenFontsReady(hide); }
      });
      mo.observe(root, { childList: true });
      setTimeout(hide, 6000); // safety fallback
    })();
  </script>
</body>
</html>
