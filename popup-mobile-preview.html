<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Newsletter-Popup — Mobile-Vorschau</title>
<script src="pf-locale.js?v=20260810k"></script>
<link rel="stylesheet" href="rd-styles.css?v=20260810k">
<style>
body{margin:0;background:#2b2620;min-height:100vh}
/* Force the mobile treatment at a true phone width, whatever this window is. */
.rd-np-scrim{position:static!important;background:transparent!important;backdrop-filter:none!important;padding:16px!important}
.rd-npa{width:390px!important}
.rd-np-scrim{transform:scale(.68);transform-origin:top left}
</style>
<script>
  window.__PF_NEWSPOP_FORCE = true;   // keep it open for this preview
  // The popup picks its layout from matchMedia; pin it to the mobile branch.
  var _mm = window.matchMedia.bind(window);
  window.matchMedia = function (q) {
    if (/max-width:\s*600px/.test(q)) return { matches: true, addEventListener: function () {}, removeEventListener: function () {}, addListener: function () {}, removeListener: function () {} };
    return _mm(q);
  };
</script>
</head>
<body>
<a href="#root" class="rd-skip">Zum Inhalt springen</a>
  <div id="root" tabindex="-1"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="pf-newsletter.js?v=20260810k"></script>
<script type="text/babel" data-presets="react" src="copy.jsx?v=20260810k"></script>
<script type="text/babel" data-presets="react" src="rd-ui.jsx?v=20260810k"></script>
<script type="text/babel" data-presets="react" src="rd-news-popup.jsx?v=20260810k"></script>
<script type="text/babel" data-presets="react">
  function Preview() {
    return (
      <div style={{ display: 'flex', gap: 20, padding: 20, alignItems: 'flex-start', flexWrap: 'wrap' }}>
        <div>
          <div style={{ color: '#a89f88', font: '600 12px/1 system-ui', letterSpacing: '.14em', textTransform: 'uppercase', marginBottom: 10 }}>Deutsch</div>
          <RdNewsPopup lang="de" />
        </div>
        <div>
          <div style={{ color: '#a89f88', font: '600 12px/1 system-ui', letterSpacing: '.14em', textTransform: 'uppercase', marginBottom: 10 }}>English</div>
          <RdNewsPopup lang="en" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Preview />);
</script>
</body>
</html>
